<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator</title>
<style>
  :root {
    --bg: #141922;
    --panel: #1c232e;
    --border: #2b3341;
    --text: #e9e7e1;
    --muted: #8891a3;
    --accent: #f0a93b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 6px;
  }
  p.sub {
    color: var(--muted);
    margin: 0 0 28px;
    font-size: 14px;
    line-height: 1.5;
  }
  .output {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 20px;
    letter-spacing: 1px;
    word-break: break-all;
    min-height: 28px;
    margin-bottom: 20px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }
  .row label {
    font-size: 14px;
    color: var(--muted);
  }
  .row input[type="number"] {
    width: 60px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 14px;
  }
  .checkboxes {
    display: grid;
    gap: 10px;
    margin-bottom: 24px;
  }
  .check {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 14px;
  }
  .check input {
    accent-color: var(--accent);
  }
  .buttons {
    display: flex;
    gap: 10px;
  }
  button {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #generateBtn {
    background: var(--accent);
    color: #201304;
  }
  #generateBtn:hover { filter: brightness(1.08); }
  #copyBtn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  #copyBtn:hover { border-color: var(--accent); }
</style>
</head>
<body>
  <div class="card">
    <h1>Password generator</h1>
    <p class="sub">Create a secure password in seconds with customizable length, numbers, and symbols.</p>

    <div class="output" id="output">Click generate to start</div>

    <div class="row">
      <label for="length">Length</label>
      <input type="number" id="length" value="8" min="1" max="256">
    </div>

    <div class="checkboxes">
      <label class="check" for="includeNumbers">
        <input type="checkbox" id="includeNumbers">
        Include numbers
      </label>

      <label class="check" for="includeSymbols">
        <input type="checkbox" id="includeSymbols">
        Include symbols
      </label>
    </div>

    <div class="buttons">
      <button id="generateBtn">Generate</button>
      <button id="copyBtn">Copy</button>
    </div>
  </div>

<script>
  const Letters = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
  const Numbers = "0123456789";
  const Symbols = "!@#$%^&*()_+[]{}|;:,.<>?";

  const output = document.getElementById("output");
  const lengthInput = document.getElementById("length");
  const includeNumbers = document.getElementById("includeNumbers");
  const includeSymbols = document.getElementById("includeSymbols");

  function getRequiredCharacterSets() {
    const sets = [Letters];

    if (includeNumbers.checked) {
      sets.push(Numbers);
    }
    if (includeSymbols.checked) {
      sets.push(Symbols);
    }

    return sets;
  }

  function createRandomChar(pool) {
    const max = 2 ** 32;
    const limit = max - (max % pool.length);
    let randomNumber;

    do {
      randomNumber = crypto.getRandomValues(new Uint32Array(1))[0];
    } while (randomNumber >= limit);

    return pool.charAt(randomNumber % pool.length);
  }

  function generatePassword(length) {
    const sets = getRequiredCharacterSets();
    const requiredCount = sets.length;
    const effectiveLength = Math.max(length, requiredCount);
    const pool = sets.join("");
    const chars = [];

    sets.forEach((set) => {
      chars.push(createRandomChar(set));
    });

    for (let i = requiredCount; i < effectiveLength; i++) {
      chars.push(createRandomChar(pool));
    }

    for (let i = chars.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [chars[i], chars[j]] = [chars[j], chars[i]];
    }

    return chars.join("");
  }

  function validateLength() {
    const value = Number.parseInt(lengthInput.value, 10);
    const minimumLength = getRequiredCharacterSets().length;

    if (!Number.isInteger(value) || value < 1 || value > 256) {
      lengthInput.setCustomValidity("Length must be between 1 and 256.");
      return null;
    }

    if (value < minimumLength) {
      lengthInput.setCustomValidity(`Length must be at least ${minimumLength} for the selected character sets.`);
      return null;
    }

    lengthInput.setCustomValidity("");
    return value;
  }

  lengthInput.addEventListener("input", () => {
    const value = lengthInput.value;

    if (value === "") {
      lengthInput.setCustomValidity("Length is required.");
      return;
    }

    validateLength();
  });

  [includeNumbers, includeSymbols].forEach((checkbox) => {
    checkbox.addEventListener("change", () => {
      validateLength();
    });
  });

  document.getElementById("generateBtn").addEventListener("click", () => {
    const length = validateLength();

    if (length === null) {
      lengthInput.reportValidity();
      return;
    }

    output.textContent = generatePassword(length);
  });

  document.getElementById("copyBtn").addEventListener("click", () => {
    if (output.textContent !== "Click generate to start") {
      navigator.clipboard.writeText(output.textContent);
    }
  });
</script>
</body>
</html>
